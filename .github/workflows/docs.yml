name: Documentation

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sphinx
        run: pip install sphinx

      - name: Build documentation
        run: python -m sphinx -W -b html docs docs/_build/html
